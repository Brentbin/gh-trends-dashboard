  .rank.top { color: #bf8700; }
  .repo-body { flex: 1; min-width: 0; }
  .repo-name { font-size: 15px; font-weight: 600; color: #0969da;
    text-decoration: none; word-break: break-all; }
  .repo-name:hover { text-decoration: underline; }
  .repo-desc { font-size: 13px; color: #424a53; margin: 4px 0 8px 0; line-height: 1.45; }
  .repo-meta { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 12px;

  .stars { color: #1f2328; font-weight: 600; }
  .period-delta { color: #1a7f37; font-weight: 600; }

    margin-right: 4px; vertical-align: middle; background: #59636e; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px;
    font-size: 11px; font-weight: 500; }
  .badge-new { background: #dafbe1; color: #1a7f37; }
  .badge-sustained { background: #fff1c2; color: #7d4e00; }
  .badge-mover { background: #ffe3e6; color: #cf222e; }

    margin-top: 6px; color: #59636e; }
  .activity .chip { display: inline-flex; align-items: center; gap: 4px;

  .activity .chip.iss-down { color: #1a7f37; border-color: #abf2bc; background: #dafbe1; }
  .activity .chip.pr-up { color: #8250df; border-color: #d8b9ff; background: #fbefff; }
  .activity .chip.pr-merge { color: #6f42c1; border-color: #d8b9ff; background: #f3e8ff; }
  .activity .chip.cm { color: #7d4e00; border-color: #fae17d; background: #fff8c5; }
  .activity .chip.err { color: #82071e; border-color: #ffcecb; background: #ffebe9; }
  .activity .commenters { color: #59636e; font-style: italic; }
  .empty { text-align: center; padding: 40px 20px; color: #59636e; font-size: 14px; }
  .footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid #d1d9e0;
    font-size: 12px; color: #59636e; text-align: center; }

  .reading-stats strong { color: #1f2328; font-weight: 600; }
  .reading-stats .dot { color: #d1d9e0; margin: 0 8px; }

  .reading-body h2:first-child { margin-top: 0; }

    border-radius: 0 6px 6px 0; margin: 0; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function langColor(lang) {
  const map = {
    "Python": "#3572A5", "TypeScript": "#3178c6", "JavaScript": "#f1e05a",
    "Rust": "#dea584", "Go": "#00ADD8", "C++": "#f34b7d", "C": "#555555",
    "Java": "#b07219", "Ruby": "#701516", "Swift": "#F05138",
    "Kotlin": "#A97BFF", "HTML": "#e34c26", "CSS": "#563d7c",
    "Shell": "#89e051", "Lua": "#000080", "Zig": "#ec915c",
    "Jupyter Notebook": "#DA5B0B"
  };
  return map[lang] || "#59636e";
}
function fmt(n) { return Number(n).toLocaleString("en-US"); }
function windowLabel(w) { return { daily: "今日", weekly: "本周", monthly: "本月" }[w] || w; }

// 把仓库的 24h activity 渲染成一行 chip
function renderActivity(act) {
  if (!act || typeof act !== "object" || !Object.keys(act).length) return "";
  if (act.error) {
    return `<div class="activity"><span class="chip err">活跃度: ${escapeHtml(act.error)}</span></div>`;
  }
  const chips = [];
  if (act.issues_opened) chips.push(`<span class="chip iss-up" title="24h 新开 issue">＋${act.issues_opened} issue</span>`);
  if (act.issues_closed) chips.push(`<span class="chip iss-down" title="24h 关闭 issue">−${act.issues_closed} issue</span>`);
  if (act.prs_opened) chips.push(`<span class="chip pr-up" title="24h 新开 PR">＋${act.prs_opened} PR</span>`);
  if (act.prs_merged) chips.push(`<span class="chip pr-merge" title="24h 合并 PR">⇪${act.prs_merged} merged</span>`);
  if (act.comments) chips.push(`<span class="chip cm" title="24h issue/PR 评论数">💬 ${act.comments}</span>`);
  if (!chips.length) chips.push(`<span class="chip" title="过去 24h 无活动">沉寂</span>`);
  const top = (act.top_commenters || []).slice(0, 3)
    .map(c => `${escapeHtml(c.login)}×${c.count}`).join("  ");
  if (top) chips.push(`<span class="commenters">主要参与：${top}</span>`);
  return `<div class="activity">${chips.join("")}</div>`;
}

function activityScore(act) {
  if (!act || act.error) return 0;
  // 真社区使用信号：issues 关闭 + PR 合并比 opened 权重高（治理工作）
  return (act.issues_opened || 0) * 1
       + (act.issues_closed || 0) * 2
       + (act.prs_opened || 0) * 2
       + (act.prs_merged || 0) * 3
       + (act.comments || 0) * 0.5;
}

// 原始动作量（不加权）：issue＋PR＋评论 总和，反映"被使用/讨论"的绝对热度
function activityRaw(act) {
  if (!act || act.error) return 0;
  return (act.issues_opened || 0) + (act.issues_closed || 0)
       + (act.prs_opened || 0) + (act.prs_merged || 0) + (act.comments || 0);
}

// ---- 今日快照：高星榜 / 高 action 榜 双榜切换 ----

// 同一 window 下算出两个榜 + 它们的"共现"集合（两榜排名都进前 K）
function todayRankedLists(win) {
  const repos = DATA.snapshot[win] || [];
  const starList = repos.slice();                       // trending 原序 = star 关注度
  const actList = repos
    .map(r => ({ r, score: activityScore(r.activity), raw: activityRaw(r.activity) }))
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score);
  // 共现门槛：两榜各自前 K（约前半，至少 5）——避免 window 小导致"人人共现"
  const K = Math.max(5, Math.ceil(repos.length / 2));
  const starTopK = new Set(starList.slice(0, K).map(r => r.full_name));
  const actTopK = new Set(actList.slice(0, K).map(x => x.r.full_name));
  const cohort = new Set([...starTopK].filter(n => actTopK.has(n)));
  return { starList, actList, cohort, K };
}

function repoCard(r, rank, opts) {
  opts = opts || {};
  const label = windowLabel(opts.win);
  const newcomers = new Set((DATA.insights.newcomers[opts.win] || []).map(x => x.full_name));
  const isNew = newcomers.has(r.full_name) && DATA.insights.dates_count > 1;
  const cohortBadge = opts.cohort
    ? `<span class="badge badge-cohort" title="关注度和使用强度都进本窗口前列：既被关注又被真在用">★⚡ 双榜共现</span>` : "";
  let extra = "";
  if (opts.mode === "action") {
    extra = `<span class="badge badge-action" title="综合活跃分：issue 关闭×2 · PR 合并×3 · 新开×2 · 评论×0.5">活跃分 ${Math.round(opts.score)}</span>`
      + `<span class="raw-count" title="原始动作量：issue＋PR＋评论 不加权总和">Σ ${opts.raw} 动作</span>`;
    if (!opts.cohort && opts.topK) extra += `<span class="badge badge-unbroken" title="action 进前列但 star 没跟上：被真在用，还没靠关注度破圈">被用未破圈</span>`;
  } else if (!opts.cohort && activityScore(r.activity) === 0) {
    extra = `<span class="badge badge-quiet" title="24h 内 issue/PR/评论全为 0：被收藏，但没人真用">24h 静默</span>`;
  }
  return `
      <div class="repo ${opts.cohort ? 'repo-cohort' : ''}">
        <div class="rank ${rank < 3 ? 'top' : ''}">${rank + 1}</div>
        <div class="repo-body">
          <a class="repo-name" href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.full_name)}</a>
          ${r.description ? `<div class="repo-desc">${escapeHtml(r.description)}</div>` : ''}
          <div class="repo-meta">
            <span class="stars">★ ${r.total_stars}</span>
            ${r.stars_today ? `<span class="period-delta">${label} +${r.stars_today}</span>` : ''}
            ${r.language ? `<span><span class="lang-dot" style="background:${langColor(r.language)}"></span>${escapeHtml(r.language)}</span>` : ''}
            ${isNew ? `<span class="badge badge-new">今天首见</span>` : ''}
            ${cohortBadge}${extra}
          </div>
          ${renderActivity(r.activity)}
        </div>
      </div>
  `;
}

function renderRanked(win, mode) {
  const { starList, actList, cohort, K } = todayRankedLists(win);
  if (mode === "action") {
    if (!actList.length) return '<div class="empty">这个窗口 24h 内都很安静，没有 action 数据</div>';
    return actList.map((x, i) => repoCard(x.r, i,
      { mode: "action", win, cohort: cohort.has(x.r.full_name), score: x.score, raw: x.raw, topK: i < K })).join("");
  }
  if (!starList.length) return '<div class="empty">没有数据</div>';
  return starList.map((r, i) => repoCard(r, i,
    { mode: "stars", win, cohort: cohort.has(r.full_name) })).join("");
}

          </div>
          ${renderActivity(r.activity)}
        </div>

    `;
    }).join("") : '<div class="empty">今天 24h 内仓库都很安静</div>';

    document.getElementById("content").innerHTML = `
      <div class="subtabs">${subtabs}</div>
      <div class="stat-row">
        <div class="stat"><div class="stat-num">${ins.dates_count}</div><div class="stat-label">累计天数</div></div>
        <div class="stat"><div class="stat-num">${movers.length}</div><div class="stat-label">涨幅榜</div></div>
        <div class="stat"><div class="stat-num">${sustained.length}</div><div class="stat-label">连续上榜</div></div>
        <div class="stat"><div class="stat-num">${newcomers.length}</div><div class="stat-label">今日首见</div></div>
      </div>
      <h3 style="font-size:14px;margin:14px 0 8px 0;">累计 star 涨幅榜（${windowLabel(currentWin)}）</h3>
      <div class="repo-list">${moversHtml}</div>
      <h3 style="font-size:14px;margin:18px 0 8px 0;">连续上榜（${windowLabel(currentWin)}）</h3>
      <div class="repo-list">${sustainedHtml}</div>
      <h3 style="font-size:14px;margin:18px 0 8px 0;">24h 社区活跃度榜（${windowLabel(currentWin)}）<span style="font-weight:normal;color:#59636e;font-size:12px;">　·　issue 关闭 ×2 · PR 合并 ×3 · 评论 ×0.5</span></h3>
      <div class="repo-list">${activeHtml}</div>
    `;
    document.querySelectorAll(".subtab").forEach(b => {
      b.addEventListener("click", () => { currentWin = b.dataset.win; render(); });
    });
  }
  render();
}

// ---- 数据档案 ----

    <div class="summary">

// ---- 解读时间线 ----
const EXPANDED_KEY = "gh-trends-expanded-v2";

function loadExpanded() {
  try { return new Set(JSON.parse(localStorage.getItem(EXPANDED_KEY)) || []); }
  catch { return new Set(); }
}
function saveExpanded(set) {
  try { localStorage.setItem(EXPANDED_KEY, JSON.stringify([...set])); } catch {}
}

// 把整篇 markdown 切成 { hook, rest }：第一个引语块当 hook，剩余是正文。
function splitHookAndBody(text) {
  const t = (text || "").trim();
  if (!t) return { hook: "", rest: "" };
  const blocks = t.split(/\n\s*\n+/);
  let hook = "";
  let restStart = 0;
  for (let i = 0; i < blocks.length; i++) {
    if (blocks[i].trim().startsWith(">")) {
      hook = blocks[i].split("\n").map(l => l.replace(/^>\s?/, "")).join(" ").trim();
      restStart = i + 1;
      break;
    }
    if (blocks[i].trim()) {
      // 没有引语，就拿第一段当 hook
      hook = blocks[i].replace(/\n/g, " ").trim();
      restStart = i + 1;
      break;
    }
  }
  const rest = blocks.slice(restStart).join("\n\n").trim();
  return { hook, rest };
}

function renderMarkdownish(text) {
  // 按段落（空行分隔）分块，每块单独处理类型
  const blocks = text.trim().split(/\n\s*\n+/);
  const parts = [];
  for (let raw of blocks) {
    const block = raw.trim();
    if (!block) continue;
    // 标题
    let m = block.match(/^(#{1,3})\s+(.+)$/);
    if (m) {
      const level = m[1].length === 1 ? 2 : m[1].length; // # 视为 h2
      const inner = inline(m[2]);
      parts.push(`<h${level}>${inner}</h${level}>`);
      continue;
    }
    // 引语 callout（支持多行 > 开头）
    if (block.startsWith(">")) {
      const inner = block.split("\n").map(l => l.replace(/^>\s?/, "")).join(" ");
      parts.push(`<div class="callout">${inline(inner)}</div>`);
      continue;
    }
    // 无序列表
    if (/^[-*]\s+/.test(block)) {
      const items = block.split("\n").filter(l => /^[-*]\s+/.test(l))
        .map(l => `<li>${inline(l.replace(/^[-*]\s+/, ""))}</li>`).join("");
      parts.push(`<ul>${items}</ul>`);
      continue;
    }
    // 普通段落
    parts.push(`<p>${inline(block.replace(/\n/g, " "))}</p>`);
  }
  return parts.join("\n");

  function inline(s) {
    // 顺序很重要：先 code、再 bold（避免吃到 code 内部的 *）
    return escapeHtml(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
}

function viewReading() {
  const content = document.getElementById("content");
  const ins = DATA.insights;
  const readings = DATA.readings || [];
  const expanded = loadExpanded();

  const dailyN = (DATA.snapshot.daily || []).length;
  const weeklyN = (DATA.snapshot.weekly || []).length;
  const monthlyN = (DATA.snapshot.monthly || []).length;
  const statsHtml = `
    <div class="reading-stats">
      累积 <strong>${ins.dates_count}</strong> 天数据
      <span class="dot">·</span><strong>${readings.length}</strong> 篇解读
      <span class="dot">·</span>今日样本 ${dailyN + weeklyN + monthlyN} 仓库
    </div>
  `;

  if (!readings.length) {
    content.innerHTML = statsHtml + `
      <div class="timeline-empty">
        还没有解读。每天早上的 scheduled task 跑完后会自动生成一篇，累积在这里。
      </div>
    `;
    return;
  }

  // 渲染时间线：每天一张卡，最新在顶
  const items = readings.map(r => {
    const isToday = r.date === DATA.today;
    const { hook, rest } = splitHookAndBody(r.text || "");
    const isOpen = expanded.has(r.date);
    const dateLabel = new Date(r.date + "T00:00:00").toLocaleDateString("zh-CN", {
      year: "numeric", month: "long", day: "numeric", weekday: "short"
    });
    const genAt = r.generated_at
      ? new Date(r.generated_at).toLocaleString("zh-CN", { hour12: false })
      : "";
    return `
      <div class="tl-item">
        <div class="tl-date-row">
          <span class="tl-date${isToday ? " today" : ""}">${escapeHtml(dateLabel)}</span>
          ${isToday ? '<span class="tl-meta">今天</span>' : ""}
        </div>
        <div class="tl-card${isOpen ? "" : " collapsed"}" data-date="${escapeHtml(r.date)}">
          <div class="tl-hook">${escapeHtml(hook)}</div>
          <div class="reading-body reading-body-full">${renderMarkdownish(rest || r.text || "")}</div>
          <div class="tl-actions">
            <button class="toggle-btn" data-date="${escapeHtml(r.date)}">
              ${isOpen ? "收起" : "展开正文"}
            </button>
            <span class="sep">·</span>
            <button class="copy-btn" data-date="${escapeHtml(r.date)}">复制 markdown</button>
            ${genAt ? `<span class="gen-at">生成于 ${escapeHtml(genAt)}</span>` : ""}
          </div>
        </div>
      </div>
    `;
  }).join("");

  content.innerHTML = statsHtml + `<div class="timeline">${items}</div>`;

  // 展开 / 收起
  content.querySelectorAll(".toggle-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const date = btn.dataset.date;
      const card = content.querySelector(`.tl-card[data-date="${date}"]`);
      const exp = loadExpanded();
      if (exp.has(date)) {
        exp.delete(date);
        card.classList.add("collapsed");
        btn.textContent = "展开正文";
      } else {
        exp.add(date);
        card.classList.remove("collapsed");
        btn.textContent = "收起";
      }
      saveExpanded(exp);
    });
  });

  // 复制 markdown
  // 在 file:// 或没有 clipboard-write 权限的 iframe 里，navigator.clipboard 不可用，
  // 退回到 execCommand('copy') + 隐藏 textarea 的老办法。
  async function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) { /* fall through */ }
    }
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "0";
      ta.style.left = "0";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  content.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const date = btn.dataset.date;
      const r = readings.find(x => x.date === date);
      if (!r) return;
      const md = `# GitHub Trending 解读 · ${date}\n\n${r.text || ""}`;
      const orig = btn.dataset.label || btn.textContent;
      btn.dataset.label = orig;
      const ok = await copyToClipboard(md);
      btn.textContent = ok ? "已复制" : "复制失败";
      setTimeout(() => { btn.textContent = orig; }, 1200);
    });
  });
}

// ---- 路由 + 状态持久化 ----
const VIEWS = { reading: viewReading, today: viewToday, trends: viewTrends, history: viewHistory };
const TAB_KEY = "gh-trends-active-tab-v1";
const SCROLL_KEY = "gh-trends-scroll-v1";  // { tabName: scrollY }

function loadScrollMap() {
  try { return JSON.parse(localStorage.getItem(SCROLL_KEY)) || {}; }
  catch { return {}; }
}
function saveScrollMap(m) {
  try { localStorage.setItem(SCROLL_KEY, JSON.stringify(m)); } catch {}
}

let currentView = null;

function go(view, opts) {
  opts = opts || {};
  // 保存当前 tab 的滚动位置
  if (currentView && !opts.skipSaveScroll) {
    const m = loadScrollMap();
    m[currentView] = window.scrollY || document.documentElement.scrollTop || 0;
    saveScrollMap(m);
  }
  currentView = view;
  try { localStorage.setItem(TAB_KEY, view); } catch {}
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === view));
  (VIEWS[view] || viewReading)();
  // 恢复该 tab 的滚动位置（如果有；否则回到顶部）
  const m = loadScrollMap();
  const y = opts.restoreScroll === false ? 0 : (m[view] || 0);
  // 双 rAF 保证 innerHTML 更新已经布局完成
  requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, y)));
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => go(t.dataset.view, { restoreScroll: false }));
});

// 滚动时持续保存当前 tab 的位置，防止页面被外部刷掉时丢失
let scrollTimer = null;
window.addEventListener("scroll", () => {
  if (scrollTimer) return;
  scrollTimer = setTimeout(() => {
    scrollTimer = null;
    if (!currentView) return;
    const m = loadScrollMap();
    m[currentView] = window.scrollY || document.documentElement.scrollTop || 0;
    saveScrollMap(m);
  }, 150);
}, { passive: true });

document.getElementById("snapshot-info").textContent =
  "快照时间：" + new Date(DATA.fetched_at).toLocaleString("zh-CN", { hour12: false });

// 恢复上次的 tab；默认进入 reading
let initialTab = "reading";
try {
  const saved = localStorage.getItem(TAB_KEY);
  if (saved && VIEWS[saved]) initialTab = saved;
} catch {}
go(initialTab, { skipSaveScroll: true });
</script>
